[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-aware-llm-router"
version = "0.1.0"
description = "A cost-aware LLM model router with quality-constrained routing."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "pyarrow>=17.0,<22.0",
    "duckdb>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
include = [
    "router*",
    "runners*",
    "eval*",
    "service*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]